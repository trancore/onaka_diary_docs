<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">おなか日記の画面構成</title>
  <desc id="desc">カレンダー、登録、設定の3画面を示す操作イメージ</desc>
  <rect width="960" height="420" rx="24" fill="#fff8f5"/>
  <text x="48" y="62" font-family="sans-serif" font-size="28" font-weight="700" fill="#3d2c2c">おなか日記の画面構成</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(48 94)">
      <rect width="260" height="270" rx="20" fill="white" stroke="#e8c9c1" stroke-width="3"/>
      <rect x="18" y="18" width="224" height="176" rx="10" fill="#fff1ec"/>
      <text x="130" y="58" font-size="20" font-weight="700" fill="#a94c45">ホーム</text>
      <g fill="#e6a39b"><rect x="42" y="80" width="42" height="28" rx="5"/><rect x="91" y="80" width="42" height="28" rx="5"/><rect x="140" y="80" width="42" height="28" rx="5"/><rect x="189" y="80" width="32" height="28" rx="5"/></g>
      <path d="M45 140h170M45 160h120" stroke="#d98b83" stroke-width="8" stroke-linecap="round"/>
      <text x="130" y="232" font-size="22" font-weight="700" fill="#3d2c2c">カレンダー</text>
      <text x="130" y="257" font-size="15" fill="#785f5f">日付から記録を確認</text>
    </g>
    <g transform="translate(350 94)">
      <rect width="260" height="270" rx="20" fill="white" stroke="#e8c9c1" stroke-width="3"/>
      <rect x="18" y="18" width="224" height="176" rx="10" fill="#f4f8ff"/>
      <text x="130" y="58" font-size="20" font-weight="700" fill="#5170a8">登録</text>
      <g fill="none" stroke="#8fa6d1" stroke-width="8" stroke-linecap="round"><path d="M48 88h164M48 120h164M48 152h120"/></g>
      <circle cx="198" cy="160" r="18" fill="#8fa6d1"/>
      <text x="130" y="232" font-size="22" font-weight="700" fill="#3d2c2c">日記を登録</text>
      <text x="130" y="257" font-size="15" fill="#785f5f">食事・排便・腹痛を入力</text>
    </g>
    <g transform="translate(652 94)">
      <rect width="260" height="270" rx="20" fill="white" stroke="#e8c9c1" stroke-width="3"/>
      <rect x="18" y="18" width="224" height="176" rx="10" fill="#f4fff5"/>
      <text x="130" y="58" font-size="20" font-weight="700" fill="#5c9668">設定</text>
      <g fill="#a1c9a7"><rect x="48" y="84" width="164" height="18" rx="9"/><rect x="48" y="120" width="120" height="18" rx="9"/><rect x="48" y="156" width="150" height="18" rx="9"/></g>
      <text x="130" y="232" font-size="22" font-weight="700" fill="#3d2c2c">設定</text>
      <text x="130" y="257" font-size="15" fill="#785f5f">通知・色を変更</text>
    </g>
  </g>
</svg>
